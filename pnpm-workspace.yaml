  "@hugeicons/react-native": 1.0.16
  "@ome-labs/api": 0.1.0
  "@storybook/addon-a11y": 10.6.6
  "@storybook/addon-docs": 10.6.6
  "@storybook/addon-themes": 10.6.6
  "@storybook/react": 10.6.6
  "@storybook/react-vite": 10.6.6
  "@svgr/core": 8.1.0
  "@svgr/plugin-jsx": 8.1.0
  "@tailwindcss/vite": 4.3.5
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.9
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  axe-core: 4.14.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  jsdom: 31.0.0
  klarity: 0.3.0
  lefthook: 2.2.2
  motion: 14.11.1
  oxfmt: 0.77.0
  oxlint: 1.92.0
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1
  react-native-svg: 15.16.0
  sharp: 0.35.5
  sonner: 2.0.8
  storybook: 10.6.6
  svgo: 4.1.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.5
  turbo: 2.11.10
  typescript: 7.0.2
  uniwind: 1.13.2
  uqr: 0.1.3
  vite: 8.3.7
  vitest: 5.1.0

allowBuilds:
  # esbuild checks its platform binary after install; Storybook bundles with it.
  esbuild: true
  lefthook: true
  # sharp downloads its prebuilt libvips for the brand export script.
  sharp: true

minimumReleaseAgeExclude:
